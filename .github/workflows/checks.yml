name: Checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Run tests
        run: pnpm test

      # Full pipeline check without the secret: throwaway solutions built
      # from the public crime catalogue (see scripts/ci-solutions.mjs).
      - name: Build site with throwaway solutions
        run: |
          node scripts/ci-solutions.mjs --force
          pnpm build
